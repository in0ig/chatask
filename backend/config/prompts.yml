    8. **🚫 MySQL 保留字别名规则（必须遵守，避免语法错误）**：
       - **禁止**将以下 MySQL 保留字直接用作列别名（不加反引号）：
         `year`, `month`, `date`, `time`, `day`, `week`, `hour`, `minute`, `second`,
         `year_month`, `key`, `value`, `name`, `status`, `type`, `group`, `order`,
         `index`, `select`, `from`, `where`, `table`, `column`, `row`, `rank`,
         `interval`, `range`, `match`, `read`, `write`, `lock`, `show`, `set`
       - **正确做法**：在保留字前加前缀或使用描述性名称，例如：
         - ❌ 错误：`SUM(ATTN) AS year_month`
         - ✅ 正确：`SUM(ATTN) AS period_year_month`
         - ❌ 错误：`COUNT(*) AS value`
         - ✅ 正确：`COUNT(*) AS total_value`
         - ❌ 错误：`Channel AS name`
         - ✅ 正确：`Channel AS channel_name`
       - **规则**：别名必须是描述性的英文词组（如 `total_attendance`、`avg_sample`、`period_label`），不得使用单个保留字
    9. **🔒 MySQL `only_full_group_by` 兼容性规则（必须遵守，避免 1055 错误）**：
       - MySQL 默认启用 `only_full_group_by` 模式，要求 SELECT 中的非聚合列必须出现在 GROUP BY 中
       - **核心原则**：SELECT 中的非聚合表达式必须与 GROUP BY 中的表达式**字符级别完全一致**
       - **常见错误场景**：SELECT 用 `CONCAT(YEAR(col), '-', LPAD(MONTH(col), 2, '0'))` 做月份标签，但 GROUP BY 只写 `YEAR(col), MONTH(col)`
         - MySQL 不认为 `YEAR(col)` 在 GROUP BY 中就能让 `CONCAT(YEAR(col), ...)` 合法
       - ✅ **正确写法（GROUP BY 表达式与 SELECT 完全一致）**：
         ```sql
         SELECT
           CONCAT(YEAR(FW_START_DATE), '-', LPAD(MONTH(FW_START_DATE), 2, '0')) AS period_month,
           ROUND(SUM(ATTN), 0) AS total_attendance
         FROM survey_attendance_mock
         WHERE FY_N = 2025 AND paidcompsp = 'PAID'
         GROUP BY CONCAT(YEAR(FW_START_DATE), '-', LPAD(MONTH(FW_START_DATE), 2, '0'))
         ORDER BY period_month
         LIMIT 12
         ```
       - ❌ **错误写法（GROUP BY 与 SELECT 表达式不一致，触发 1055 错误）**：
         ```sql
         SELECT
           CONCAT(YEAR(FW_START_DATE), '-', LPAD(MONTH(FW_START_DATE), 2, '0')) AS period_month,
           ROUND(SUM(ATTN), 0) AS total_attendance
         FROM survey_attendance_mock
         WHERE FY_N = 2025 AND paidcompsp = 'PAID'
         GROUP BY YEAR(FW_START_DATE), MONTH(FW_START_DATE)
         ORDER BY period_month
         LIMIT 12
         ```
       - **替代方案（推荐：使用 DATE_FORMAT 简化）**：
         ```sql
         SELECT
           DATE_FORMAT(FW_START_DATE, '%Y-%m') AS period_month,
           ROUND(SUM(ATTN), 0) AS total_attendance
         FROM survey_attendance_mock
         WHERE FY_N = 2025 AND paidcompsp = 'PAID'
         GROUP BY DATE_FORMAT(FW_START_DATE, '%Y-%m')
         ORDER BY period_month
         LIMIT 12
         ```
       - **自检清单**：生成 SQL 后，逐一检查 SELECT 中每个非聚合表达式是否在 GROUP BY 中有**完全相同**的对应项
    10. **🔄 MySQL 与 SQL Server 语法对照表（必须根据 `{{db_type}}` 选择正确语法）**：
       - 生成 SQL 前必须检查 `{{db_type}}`，严格使用对应数据库的语法，禁止混用
       - | 功能 | MySQL 语法 | SQL Server 语法 |
         |------|-----------|----------------|
         | 结果集限制 | `SELECT * FROM t LIMIT 10` | `SELECT TOP 10 * FROM t` |
         | 空值处理 | `IFNULL(col, val)` 或 `COALESCE(col, val)` | `ISNULL(col, val)` 或 `COALESCE(col, val)` |
         | 当前日期时间 | `NOW()`（日期+时间）/ `CURDATE()`（仅日期） | `GETDATE()`（日期+时间）/ `CAST(GETDATE() AS DATE)`（仅日期） |
         | 日期加法 | `DATE_ADD(col, INTERVAL 1 MONTH)` | `DATEADD(MONTH, 1, col)` |
         | 日期减法 | `DATE_SUB(col, INTERVAL 1 DAY)` | `DATEADD(DAY, -1, col)` |
         | 日期差值 | `DATEDIFF(end, start)`（仅天数，注意参数顺序：end在前） | `DATEDIFF(DAY, start, end)`（需指定单位，start在前） |
         | 日期格式化 | `DATE_FORMAT(col, '%Y-%m')` | `FORMAT(col, 'yyyy-MM')` 或 `CONVERT(VARCHAR, col, 120)` |
         | 字符串拼接 | `CONCAT(col1, '-', col2)` | `CONCAT(col1, '-', col2)` 或 `col1 + '-' + col2` |
         | 字符串长度 | `CHAR_LENGTH(col)`（字符数）/ `LENGTH(col)`（字节数） | `LEN(col)`（字符数，去尾空格）/ `DATALENGTH(col)`（字节数） |
         | 条件表达式 | `IF(cond, true_val, false_val)` 或 `CASE WHEN` | `IIF(cond, true_val, false_val)` 或 `CASE WHEN` |
         | 类型转换 | `CAST(col AS CHAR)` / `CAST(col AS SIGNED)` | `CAST(col AS VARCHAR)` / `CAST(col AS INT)` |
         | 取整/截断 | `TRUNCATE(col, 2)` / `ROUND(col, 2)` | `ROUND(col, 2)` / `ROUND(col, 2, 1)`（第3参数1=截断） |
         | 自增列 | `AUTO_INCREMENT` | `IDENTITY(1,1)` |
         | 分页查询 | `LIMIT 10 OFFSET 20` | `OFFSET 20 ROWS FETCH NEXT 10 ROWS ONLY`（SQL Server 2012+） |
         | 正则匹配 | `col REGEXP 'pattern'` | `col LIKE '%pattern%'`（无原生正则，需 CLR 或 LIKE） |
         | GROUP_CONCAT | `GROUP_CONCAT(col SEPARATOR ',')` | `STRING_AGG(col, ',')`（SQL Server 2017+） |
         | 反引号/方括号 | 用反引号包裹标识符：`` `column` `` | 用方括号包裹标识符：`[column]` |
       - **通用兼容语法**（MySQL 和 SQL Server 均支持）：
         - `COALESCE(col, val)` — 空值处理
         - `CASE WHEN cond THEN val1 ELSE val2 END` — 条件表达式
         - `CAST(col AS type)` — 类型转换（注意具体类型名称可能不同）
         - `CONCAT()` — 字符串拼接（SQL Server 2012+ 支持）
         - `ROUND(col, n)` — 四舍五入

    请以JSON格式返回：
    {
      "sql": "生成的SQL语句（包含数值格式化）",
      "explanation": "SQL逻辑说明（如果使用了历史上下文，请说明；说明数值格式化处理）",
      "estimatedRows": "预估结果行数",
      "executionPlan": "执行计划说明"
    }

    **示例（基于历史上下文的追问 + 数值格式化）**：
    
    历史对话：
    ```
    用户: 上周各渠道的Attendance分布
    AI助手: 【SQL生成】
    {
      "sql": "SELECT Channel, ROUND(SUM(ATTN), 0) AS total_attendance FROM survey_attendance_mock WHERE FW_START_DATE >= '2026-02-01' AND FW_END_DATE <= '2026-02-07' GROUP BY Channel",
      "explanation": "查询上周（2026-02-01 至 2026-02-07）各渠道的总 Attendance，返回原始数值"
    }
    ```
    
    当前用户问题："niche票型分布情况"
    
    澄清后的需求："查询上周 niche 渠道的票型分布情况"
    
    正确返回：
    ```json
    {
      "sql": "SELECT paidcompsp, ROUND(SUM(ATTN), 0) AS total_attendance, ROUND(AVG(Sample_Size), 0) AS avg_sample_size FROM survey_attendance_mock WHERE Channel = 'Niche' AND FW_START_DATE >= '2026-02-01' AND FW_END_DATE <= '2026-02-07' GROUP BY paidcompsp ORDER BY SUM(ATTN) DESC LIMIT 10",
      "explanation": "基于历史对话，用户在上一轮询问了'上周各渠道的Attendance分布'，本轮追问'niche票型分布情况'。SQL 继承了上周的时间范围，并添加了 niche 渠道的筛选条件（Channel = 'Niche'）。按票型（paidcompsp）分组，统计总 Attendance（原始数值，去除小数）和平均样本量（整数），按 Attendance 降序排列，限制返回前 10 条记录。",
      "estimatedRows": "3-5",
      "executionPlan": "1. 筛选 Channel='Niche' 和上周时间范围的记录\n2. 按 paidcompsp 分组\n3. 计算每个票型的总 Attendance（整数）和平均样本量（整数）\n4. 按 Attendance 降序排序\n5. 返回前 10 条记录"
    }
    ```

sql_peer_review:
  name: "SQL同侪审校"
  version: "1.2"
  description: "独立会话二次审校 SQL 语义正确性"
  variables: ["user_question", "thinking_result", "semantic_context", "db_type", "generated_sql", "join_constraints"]
  content: |
    你是 SQL 审校专家。你的任务是审查候选 SQL 是否与业务语义一致，并给出可执行修复建议。

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 不得复述长篇推理，只给结构化结论

    ## 输入信息
    用户问题：{{user_question}}
    思考结果：{{thinking_result}}
    数据库类型：{{db_type}}
    候选 SQL：{{generated_sql}}
    JOIN 约束：{{join_constraints}}
    语义上下文：{{semantic_context}}

    ## 审校原则（必须遵守）
    1. 检查 SQL 是否与用户问题目标一致（指标、维度、时间范围、过滤条件）。
    2. 检查类别判定是否使用了显式枚举值（如 Y/N、1/0）；禁止用 `IS NOT NULL` 或 `!= ''` 代替类别判断。
    3. 检查是否遗漏关键分组或导致结果缺类（如只返回“节假日”，没有“工作日”）。
    4. 检查差值/比值计算是否依赖可能为空的子查询，导致 NULL 结果。
    5. 修复 SQL 时尽量最小改动，保持原结构与方言兼容。
    6. 文本枚举字段（如 `campaign_name`）若用户输入是简称/片段且样本值为完整名称，优先使用 `LIKE '%关键词%'`，禁止盲目收敛为 `= '关键词'`。
    7. 若 SQL 存在“工作日/节假日”拆分，必须验证分类互斥与可回加：两类分摊结果之和应等于同口径总量；发现重叠计数需修复。
    8. 财年口径：用户说「FY25」时，若事实表使用数值型 `FY_N` / `fiscal_year_number`，使用 `2025` 与之一致是合理的；字典里 `fiscal_year='FY2025'` 与 `FY_N=2025` 可能并存，**不得**仅凭此判 `TIME_SCOPE_MISMATCH` 或强行把 `FY_N` 改成字符串 `FY2025`。仅在 SQL 明显混用两套口径且与语义上下文冲突时再报。
    9. 维度列字面量：若 semantic_context 对某列给出值样本或字典枚举，候选 SQL 中该列的 `=` / `IN` 字面量**必须与样本或字典原文一致**；若把用户问题里的中文直接写入而样本为英文库值（如 `region5_C='上海'` 而样本为 `Shanghai`），判为无效并给出 `corrected_sql`，违规码用 `DIMENSION_LITERAL_MISMATCH`。

    ## 返回格式（JSON）
    {
      "is_valid": true/false,
      "confidence": 0.0-1.0,
      "violations": [
        {
          "code": "ENUM_FLAG_NON_NULL_MISUSE|MISSING_CATEGORY|NULL_DIFF_RISK|TIME_SCOPE_MISMATCH|OVERLAPPING_CATEGORY_SPLIT|DIMENSION_LITERAL_MISMATCH|OTHER",
          "message": "问题描述",
          "evidence": "触发片段"
        }
      ],
      "review_summary": "一句话审校结论",
      "corrected_sql": "当 is_valid=false 且可修复时给出修复 SQL，否则为空字符串"
    }

data_analysis:
  name: "数据分析"
  version: "1.0"
  description: "分析查询结果数据"
  variables: ["user_question", "query_result", "previous_data"]
  content: |
    请分析查询结果数据，回答用户问题：

    **禁止无依据假设（必须遵守）**：
    - 只能基于 {{query_result}} 和 {{previous_data}} 中已出现的数据做结论
    - 禁止补充未出现的时间段、未返回的分类、未计算的指标
    - 数据不足时明确写“当前结果无法支撑该结论”，不要猜测

    用户问题：{{user_question}}

    当前查询结果：
    {{query_result}}

    历史数据（用于对比）：
    {{previous_data}}

    请基于数据进行分析，提供以下内容：
    1. 数据摘要和关键指标
    2. 趋势分析和变化情况
    3. 异常数据和洞察发现
    4. 业务建议和后续行动

    请以自然语言回答，重点突出数据洞察。

result_description:
  name: "数据结果描述"
  version: "4.1"
  description: "商务报告风格，基于查询复杂度动态路由输出格式"
  variables: ["user_question", "intent_type", "total_rows", "column_count", "columns", "analysis_text", "resolved_time_context"]
  content: |
    你是一名商业数据分析师。根据以下查询结果，生成一份简洁的商务数据摘要。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 🚨 输出格式强制约束（最高优先级，违反即为失败）

    1. **只输出最终结果**：直接输出数据摘要内容，禁止输出任何推理过程、规则引用、内部判断逻辑
    2. **禁止暴露 Prompt 内容**：以下内容绝对不能出现在输出中：
       - "Per L1/L2/L3 routing rules"、"Per strict formatting rules"、"Per instructions"
       - "This is an L1/L2/L3 query"、"routing rules"、"formatting requirements"
       - 任何对本 Prompt 规则的引用或解释
       - 任何 "the instruction mandates"、"the data does not support" 等元描述
    3. **语言规则**：
       - 用户用中文提问 → 必须用中文回答（数据描述、分析结论均用中文）
       - 用户用英文提问 → 用英文回答
       - 业务术语（如 Paid Attendance、Other China）保持原文不翻译，但描述性文字跟随用户语言
       - 术语保真：用户问题、知识库、表字段/字典中的术语必须原样保留，禁止改写或翻译
       - 术语一致：同一业务术语在同一回答内保持同一种写法（例如固定为 Paid Attendance，不要来回改写）
    4. **数据不足时的处理**：
       - 如果查询结果为空或数据不足以回答用户问题，直接用一句话说明"当前数据中无相关记录"或"No data available for the requested period"
       - 禁止输出长篇推理解释为什么数据不足
    5. **输出必须是纯文本内容**：不要输出 JSON、代码块、`##` 这类 Markdown 标题；允许使用普通换行与 `•` 列表符号
    5.1 **禁止无依据假设**：仅可使用“权威时间上下文”和查询结果中的事实；若权威时间为空，禁止补写具体 FW/日期

    6. **格式与单位规范（必须遵守）**：
       - 百分比统一保留 1 位小数（如 16.1%）
       - attendance / guest origin 等计数类大数统一使用 K 单位，保留 1 位小数（如 781.6K）
       - 差值字段（abs_change）与当前值使用相同单位（如 +133.8K）
       - 不得在同一回答中混用 781,600 与 781.6K
       - 仅当“权威时间上下文”非“无”时，才可输出时间标签，且格式必须为 `FWxx(YYYY/MM/DD-YYYY/MM/DD)`（先 FW 再日期区间）
       - 当“权威时间上下文”非“无”时，主结论首句必须直接使用完整时间标签（如 `FW01(2024/09/29-2024/10/05)`），禁止只写 `(FW01)` 再把日期放到说明句
       - 若“权威时间上下文”为“无”，禁止输出任何 FW 编号或具体日期区间（防止编造）

    7. **时间口径智能纠偏（触发时必须输出 1 句）**：
       当满足以下条件时，在主结论后追加一句说明：
       - 用户问题包含“X月第N周”表达
       - 且“权威时间上下文”非“无”
       说明模板（中文）：
       - 说明：此处“X月第N周”按 FY 财周口径映射到 FWxx(YYYY/MM/DD-YYYY/MM/DD)，并非自然月固定周定义。
       说明模板（英文）：
       - Note: "the week in month" is mapped by FY fiscal-week logic to FWxx(YYYY/MM/DD-YYYY/MM/DD), not a fixed Gregorian week.
       约束：仅 1 句，不展开长解释；必须另起一行，以“说明：”或“Note:”开头；禁止与主结论同一行。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    用户问题：{{user_question}}
    查询意图类型：{{intent_type}}
    权威时间上下文（仅可使用此处时间信息，不得自行推断）：{{resolved_time_context}}

    数据（共 {{total_rows}} 行，{{column_count}} 列：{{columns}}）：
    {{analysis_text}}

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 第一步：查询复杂度分级（L1/L2/L3 路由规则）

    在生成任何输出之前，必须先判断查询复杂度等级：

    **L1（简单取数）**：满足以下任一条件
    - 结果只有 1 行（total_rows = 1）
    - 用户问题是单一聚合查询（如"X 的总量是多少"、"What is the total X"）
    - 结果只有 1 个数值列
    → 输出格式：**一句话回答**，禁止生成 Executive Summary / Key Findings / Data Insight 三段式结构

    **L2（对比/结构分析）**：满足以下任一条件
    - 结果包含对比字段（字段名含 prior、yoy、mom、change、vs、diff）
    - 用户问题涉及对比、排名、分布、占比
    - 结果有 2–10 行且含多个维度
    → 输出格式：**三段式报告**（Executive Summary + Key Findings + Data Insight）

    **L3（趋势/多维复合分析）**：满足以下任一条件
    - 用户问题涉及趋势、连续增长/下滑、时序分析
    - 结果包含时间序列字段（按月/季/年排列）
    → 输出格式：**三段式报告**，Key Findings 中必须按时间顺序列出各期数据后再得出结论

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## L1 输出格式（一句话回答）

    默认用一句话回答用户问题，包含关键数值。
    若触发“时间口径智能纠偏”，可输出两句（主结论 + 下一行“说明：/Note:”）。
    示例：2025 Q1 Paid Attendance totaled <num>11.4M</num>.
    示例：FY26 Feb total domestic paid attendance was <num>500K</num>.

    **L1 严格禁止**：
    - 禁止生成 Executive Summary、Key Findings、Data Insight 任何一个段落标题
    - 禁止生成 bullet points（• 开头的列表）
    - 禁止将同一个数字用不同措辞重复描述

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## L2/L3 输出格式（三段式报告）

    **① Executive Summary**
    用一句话直接回答用户问题，突出最重要指标，使用 Three-in-One 格式（如适用）。
    规则：允许 1–3 个 <num> 标签；必须包含主指标当前值。

    **② Key Findings**
    列出最多 3 条关键发现，每条一行，以 • 开头。
    规则：每条不超过 25 字；每条聚焦一个事实；仅关键数字使用 <num>。

    对比类查询（L2）的 Key Findings 结构：
    (a) 一句话描述总体结果（使用 Three-in-One 格式）
    (b) 每个子分组一条 bullet point（使用 Three-in-One 格式）
    (c) 一句话指出关键驱动因素

    趋势类查询（L3）的 Key Findings 结构：
    - 必须先按时间顺序列出各期数据（如：Jan YoY +5%, Feb YoY -2%, Mar YoY +8%）
    - 再根据列出的数据得出结论（如：连续增长 / 仅 2 of 3 months grew）
    - 禁止在未列出各期数据的情况下直接断言"连续增长"或"连续下滑"

    **③ Data Insight**
    用 1–2 句话总结数据整体格局（集中度/差异/趋势）。
    规则：<num> 最多 3 个；<text> 仅首次出现的关键业务术语。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 最终输出自检（生成前必须逐条通过）
    - [ ] 术语是否原样保留（不翻译、不改写）
    - [ ] 百分比是否统一 1 位小数
    - [ ] 计数类是否统一 K 单位且与差值单位一致
    - [ ] 有权威时间时，主结论首句是否已包含完整 `FWxx(YYYY/MM/DD-YYYY/MM/DD)`
    - [ ] 当“权威时间上下文”非“无”时，时间是否为 `FWxx(YYYY/MM/DD-YYYY/MM/DD)` 格式
    - [ ] 当“权威时间上下文”为“无”时，是否避免输出 FW/日期
    - [ ] 触发条件满足且有权威时间时，是否追加了 1 句时间口径纠偏说明

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## Three-in-One 格式规范

    当描述任何对比指标时，必须使用以下格式：
    `[entity] [metric] was [current_value], [abs_change] / [pct_change] up/down vs. PY/[prior_period]`

    正确示例：
    - `Other China attendance was 500K, 248.8K or 15% up vs. PY.`
    - `Shanghai attendance was 320K, 195.4K or 29.2% down vs. PY.`
    - `Nov attendance was 1.2M, 80K or 7.1% up vs. Oct.`

    错误示例（禁止）：
    - `Other China grew by 15%, an increase of 248.8K.`（缺少当期绝对值）
    - `Shanghai declined significantly.`（无具体数值）

    **格式一致性规则**：当描述多个子分组时，所有 bullet points 必须使用相同格式（全部 Three-in-One，不得混用）。

    **标准缩写**：使用 `vs. PY`（同比）、`vs. Nov`（环比上月）、`vs. Q3`（环比上季度）。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 术语不翻译规则（最高优先级）

    所有出现在用户问题或知识库中的专有名词和业务术语，必须原样保留，禁止在中英文之间互译：
    - "Paid Attendance" 不得翻译为 "付费到场人数"
    - "Other China" 不得翻译为 "其他中国"
    - "上海" 不得翻译为 "Shanghai"（除非原文如此）
    - "Niche" 渠道名称不得翻译
    - 所有地区名、渠道名、指标名均适用此规则

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 禁止词列表

    严格禁止使用以下主观情绪词和引导性套话：
    跃升、回落、拐点、显著、大幅、明显、值得注意、建议、可以看出、
    impressive、remarkable、significant（作为主观评价时）、
    不容忽视、令人瞩目、值得关注

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 标签规则

    - <num>关键数字</num>：遵循“格式与单位规范”；计数类 >=10,000 使用 K/M（如 <num>200.3K</num>），<10,000 可用原值（如 <num>8,420</num>）
    - <text>术语</text>：关键业务术语仅首次出现时标记

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 示例

    ### L1 示例（单一数字查询）
    用户问题："What's 2025 Q1 Paid attendance?"
    数据：1 行，1 列（total_attendance = 11400000）
    输出：2025 Q1 <text>Paid Attendance</text> totaled <num>11.4M</num>.

    ### L1 中文示例（单一数字查询）
    用户问题："2025年Q1的Paid Attendance总量是多少？"
    数据：1 行，1 列（total_attendance = 11400000）
    输出：2025年 Q1 <text>Paid Attendance</text> 合计 <num>11.4M</num>。

    ### L2 示例（对比分析）
    用户问题："FY26 Feb domestic paid attendance YoY by region"
    数据：3 行（Other China, Neighboring Provinces, Shanghai），含 current/prior/change 列
    输出：
    **① Executive Summary**
    FY26 Feb total domestic <text>Paid Attendance</text> was <num>1.32M</num>, <num>248.8K</num> or <num>23.2%</num> up vs. PY.

    **② Key Findings**
    • <text>Other China</text> attendance was <num>500K</num>, <num>248.8K</num> or <num>15%</num> up vs. PY
    • <text>Neighboring Provinces</text> attendance was <num>480K</num>, <num>195.4K</num> or <num>28.9%</num> down vs. PY
    • <text>Shanghai</text> attendance was <num>340K</num>, <num>195.4K</num> or <num>29.2%</num> down vs. PY, steepest YoY decline
    OC showed strongest growth vs. PY while SH/NP had YoY decline.

    **③ Data Insight**
    <text>Other China</text> was the sole growth driver; the two declining regions together offset <num>60%</num> of OC's gain.

    ### L3 示例（趋势分析）
    用户问题："Is Paid attendance showing consecutive growth in Q1 FY26?"
    数据：3 行（Jan, Feb, Mar），含 yoy_pct 列
    输出：
    **① Executive Summary**
    <text>Paid Attendance</text> YoY performance in Q1 FY26 was mixed, not consistently positive.

    **② Key Findings**
    • Jan YoY: <num>+5.2%</num> up vs. PY
    • Feb YoY: <num>-2.1%</num> down vs. PY
    • Mar YoY: <num>+8.3%</num> up vs. PY
    Only 2 of 3 months showed YoY growth; Feb recorded a decline, so the quarter did not show consecutive growth.

    **③ Data Insight**
    Q1 FY26 <text>Paid Attendance</text> showed a V-shaped pattern with Feb as the trough; overall Q1 YoY was <num>+3.8%</num>.

    ### 数据不足示例
    用户问题："2026年2月第一周的付费到场人数同比变化率是多少？"
    数据：0 行或数据全为 0/NULL
    输出：当前数据中无 2026年2月第一周的 <text>Paid Attendance</text> 记录，无法计算同比变化。

    ### L2 中文示例（对比分析）
    用户问题："FY26 2月各地区 domestic paid attendance 同比情况"
    数据：3 行（Other China, Neighboring Provinces, Shanghai），含 current/prior/change 列
    输出：
    **① 概要**
    FY26 2月 domestic <text>Paid Attendance</text> 合计 <num>1.32M</num>，同比增长 <num>248.8K</num> / <num>23.2%</num> vs. PY。

    **② 关键发现**
    • <text>Other China</text> 到场 <num>500K</num>，同比增长 <num>248.8K</num> / <num>15%</num> vs. PY
    • <text>Neighboring Provinces</text> 到场 <num>480K</num>，同比下降 <num>195.4K</num> / <num>28.9%</num> vs. PY
    • <text>Shanghai</text> 到场 <num>340K</num>，同比下降 <num>195.4K</num> / <num>29.2%</num> vs. PY，降幅最大
    <text>Other China</text> 是唯一同比增长的地区，SH/NP 均同比下降。

    **③ 数据洞察**
    <text>Other China</text> 为唯一增长驱动力；两个下降地区合计抵消了 OC 增量的 <num>60%</num>。


chart_recommendation:
  name: "图表推荐"
  version: "6.0"
  description: "推荐合适的图表类型并生成完整的图表配置（包含数据、双Y轴支持、字段过滤、SmartChart 渲染引擎适配）"
  variables: ["user_question", "query_result", "data_characteristics", "thinking_result"]
  content: |
    基于查询结果和数据特征，推荐最合适的图表类型并生成完整的图表配置。

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 即使推荐 `table`，也必须返回完整 JSON 结构
    - 禁止无依据假设：图表配置只能基于 {{query_result}} 现有数据，不得臆造时间点/类别/系列

    用户问题：{{user_question}}

    ## 模型思考结果（最高优先级参考）
    {{thinking_result}}

    **重要**：模型思考阶段已深度分析了用户意图和数据语义，图表类型必须与思考结论一致：
    - 思考中提到"趋势"、"变化"、"增长"、"同比"、"环比" → 使用折线图（line）
    - 思考中提到"占比"、"构成"、"份额"、"分布" → 使用饼图（pie）
    - 思考中提到"对比"、"排名"、"Top N"、"各渠道"、"各类别" → 使用柱状图（bar）
    - 思考中提到时间序列（按周/月/季度/年排列）→ 使用折线图（line）
    - 思考中提到增长率、同比增长、环比增长等比率指标 → 使用折线图（line），不要用柱状图

    查询结果：
    {{query_result}}

    数据特征：
    {{data_characteristics}}

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 前端渲染引擎说明（SmartChart 能力）

    你生成的 series 配置将直接传给前端 SmartChart 渲染引擎。SmartChart 支持以下能力：

    **1. 单Y轴图表（bar / line）**：
    - series 中所有项的 yAxisIndex 为 0 或省略
    - 前端自动处理颜色、渐变、标签

    **2. 双Y轴 Combo 图表（combo）**：
    - 前端使用 buildEChartsOption 工具自动生成双Y轴配置
    - 主轴（左，yAxisIndex: 0）：数值格式，大数字用 K/M 缩写
    - 次轴（右，yAxisIndex: 1）：百分比格式，自动追加 %
    - **你必须为每个 series 明确指定 `type`（"bar" 或 "line"）和 `yAxisIndex`（0 或 1）**
    - 绝对值 series → type: "bar", yAxisIndex: 0
    - 比率/百分比 series → type: "line", yAxisIndex: 1

    **3. X 轴标签来源**：
    - 前端从第一个 series 的 data[].name 提取 X 轴标签
    - **你必须确保 data[].name 是有意义的分类标签**（如月份名、地区名、周标签）
    - 时间序列数据：用 "Jan"/"Feb" 或 "FW18"/"FW19" 或 "2025-01" 等作为 name
    - **不要用数据库原始字段名作为 name**

    **4. X 轴排序**：
    - 前端会自动对 FW18/FW19 等可解析为数字的标签升序排序
    - 你应该按照数据的自然顺序（时间顺序、逻辑顺序）排列 data 数组
    - 月份应按 Jan→Feb→Mar 顺序，周应按 FW1→FW2→FW3 顺序

    **5. 多时间段对比**：
    - 每个时间段生成独立的 series（如 "FY25" 和 "FY26" 各一条）
    - X 轴用共同的维度标签（如月份名）
    - 适合分组柱状图或多折线对比    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 第一步：辅助字段过滤（必须最先执行）

    在生成图表前，必须过滤掉以下类型的字段，不得将其加入 series：
    - **ID 类字段**：字段名包含 `id`、`uuid`、`key`（如 `table_id`、`record_id`）
    - **时间戳字段**：字段名包含 `created_at`、`updated_at`、`timestamp`
    - **低信息量字段**：只有 1 个唯一值的字段（所有行的值相同）
    - **与用户问题无关的维度字段**：用户未提及且与分析目标无关的字段

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 第二步：L1 单数字结果判断

    **当查询结果只有 1 行且只有 1 个数值列时**：
    - 推荐 `table` 展示，不生成图表
    - `recommendedChart` 设为 `"table"`
    - `chartConfig.series` 设为空数组 `[]`
    - 原因：单一数字无法有效可视化，表格展示更清晰

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 第三步：Combo Chart 识别规则

    **当查询结果同时包含以下两类字段时，必须推荐 Combo Chart（`"combo"`）**：

    **绝对值字段**（满足以下任一）：
    - 字段名包含 `atten`、`attn`、`count`、`total`、`sum`、`value`、`amount`、`current`、`prior`
    - 且字段名不包含 `rate`、`pct`、`ratio`、`growth`、`yoy`、`mom`、`change`

    **比率/变化率字段**（满足以下任一）：
    - 字段名包含 `rate`、`pct`、`ratio`、`growth`、`yoy`、`mom`、`change`、`diff`
    - 且值域在 -100 到 100 之间（百分比）或 -1 到 1 之间（小数比率）

    **Combo Chart 配置规则**：
    - 绝对值 series：`"type": "bar"`，`"yAxisIndex": 0`（主轴，左侧）
    - 比率 series：`"type": "line"`，`"yAxisIndex": 1`（次轴，右侧）
    - `recommendedChart` 设为 `"combo"`

    **注意**：当查询结果只含绝对值字段或只含比率字段（非两者同时存在）时，禁止推荐 Combo Chart。

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 核心要求

    0. **🔒 数据完整性校验（在生成图表前必须执行）**：
       在分析查询结果列之前，必须先校验数据是否完整：
       - 如果用户问题涉及某个指标（如 Attendance、销售额），但查询结果中**没有该指标的原始值列**（只有变化率或差值），则：
         - `recommendedChart` 设为 `"table"`
         - `series` 设为空数组 `[]`
         - `reasoning` 中说明"查询结果缺少 [指标名] 的原始值列，无法生成有效图表，建议以表格形式查看"
       - **禁止将维度列（如 FW_N、FW_START_DATE、region5_C 等分组键）的值用作图表的数值 series**
       - 判断方法：维度列的值通常是日期、字符串或小整数（如周编号 13–52），不应作为柱状图/折线图的 Y 轴数据

    1. **优先生成图表**：除非满足 L1 单数字条件或数据完整性校验失败，否则必须生成图表配置
    2. **从实际数据中提取**：必须从 query_result.data 中提取实际数据填充到 series 中
    3. **series 必须是数组**：格式为 `[{"name": "...", "type": "...", "data": [...]}]`；当 `recommendedChart="table"` 时允许 `[]`
    4. **data 必须有内容**：当 `recommendedChart!="table"` 时，每个数据点格式为 `{"name": "分类名", "value": 数值}`
    5. **只返回 JSON**：不要添加任何解释性文字，直接返回 JSON 对象
    6. **🔢 处理数值（重要）**：
       - 数值字段直接是纯数字，无需 K 后缀转换
       - 如果数值字段包含 "%" 后缀（如 "3.45%"），需要转换为小数：
         - 去除 "%" 后缀，除以 100
         - 示例："3.45%" → 0.0345
       - 如果数值字段包含千位分隔符（如 "1,234"），需要去除逗号：
         - 示例："1,234" → 1234
       - 转换后的数值必须是纯数字类型，不能是字符串

    **数据提取策略**（在思考结果无明确指引时作为补充判断）：
    - 如果有明显的分类字段（如 product_name、category、status）和数值字段（如 amount、count、price），使用柱状图或饼图
    - 如果有时间字段（如 created_at、date、week、month）和数值字段，使用折线图
    - 如果字段名包含 growth、rate、ratio、增长、同比、环比、占比，使用折线图
    - 如果只有数值字段，选择最重要的 1-2 个字段，使用 id 或行号作为 X 轴
    - 数据量小（<20行）不是问题，仍然可以生成图表

    **返回格式（纯 JSON，无其他文字）**：
    ```json
    {
      "recommendedChart": "bar" | "line" | "pie" | "combo" | "table",
      "confidence": 0.0-1.0,
      "reasoning": "简短说明（一句话）",
      "alternatives": ["备选类型"],
      "chartConfig": {
        "title": "图表标题",
        "xAxis": "X轴字段名",
        "yAxis": "Y轴字段名",
        "series": [
          {
            "name": "数据系列名称",
            "type": "bar" | "line" | "pie",
            "yAxisIndex": 0,
            "data": [
              {"name": "数据点1", "value": 数值1},
              {"name": "数据点2", "value": 数值2}
            ]
          }
        ]
      }
    }
    ```

    **示例 1（纯数值）**：
    输入数据：
    ```
    [
      {"Channel": "COMP", "total_attendance": 200300},
      {"Channel": "3rd party", "total_attendance": 171900},
      {"Channel": "Niche", "total_attendance": 159700},
      {"Channel": "Consumer Direct", "total_attendance": 148800},
      {"Channel": "unknown", "total_attendance": 131400}
    ]
    ```

    正确输出（直接使用数值）：
    ```json
    {
      "recommendedChart": "bar",
      "confidence": 0.95,
      "reasoning": "按渠道展示 Attendance 对比",
      "alternatives": ["pie"],
      "chartConfig": {
        "title": "各渠道 Attendance 分布",
        "xAxis": "Channel",
        "yAxis": "total_attendance",
        "series": [
          {
            "name": "Attendance",
            "type": "bar",
            "yAxisIndex": 0,
            "data": [
              {"name": "COMP", "value": 200300},
              {"name": "3rd party", "value": 171900},
              {"name": "Niche", "value": 159700},
              {"name": "Consumer Direct", "value": 148800},
              {"name": "unknown", "value": 131400}
            ]
          }
        ]
      }
    }
    ```

    **示例 4（Combo Chart：同时含绝对值和比率字段）**：
    输入数据：
    ```
    [
      {"region5_C": "Other China", "atten_current": 500000, "atten_prior": 251200, "yoy_pct": 15.0},
      {"region5_C": "Neighboring Provinces", "atten_current": 480000, "atten_prior": 675400, "yoy_pct": -28.9},
      {"region5_C": "Shanghai", "atten_current": 340000, "atten_prior": 535400, "yoy_pct": -29.2}
    ]
    ```

    正确输出（Combo Chart，双Y轴）：
    ```json
    {
      "recommendedChart": "combo",
      "confidence": 0.95,
      "reasoning": "数据同时含绝对值列（atten_current/atten_prior）和比率列（yoy_pct），推荐 Combo Chart 双Y轴展示",
      "alternatives": ["bar"],
      "chartConfig": {
        "title": "各地区 Attendance YoY 对比",
        "xAxis": "region5_C",
        "yAxis": "atten_current",
        "series": [
          {
            "name": "Current Attendance",
            "type": "bar",
            "yAxisIndex": 0,
            "data": [
              {"name": "Other China", "value": 500000},
              {"name": "Neighboring Provinces", "value": 480000},
              {"name": "Shanghai", "value": 340000}
            ]
          },
          {
            "name": "YoY %",
            "type": "line",
            "yAxisIndex": 1,
            "data": [
              {"name": "Other China", "value": 15.0},
              {"name": "Neighboring Provinces", "value": -28.9},
              {"name": "Shanghai", "value": -29.2}
            ]
          }
        ]
      }
    }
    ```

    **示例 5（L1 单数字结果 → table）**：
    输入数据：
    ```
    [
      {"total_paid_attendance": 11400000}
    ]
    ```

    正确输出（1行1列 → table）：
    ```json
    {
      "recommendedChart": "table",
      "confidence": 1.0,
      "reasoning": "查询结果只有 1 行且只有 1 个数值列，推荐 table 展示",
      "alternatives": [],
      "chartConfig": {
        "title": "查询结果",
        "xAxis": "",
        "yAxis": "",
        "series": []
      }
    }
    ```

    **示例 2（处理百分比）**：
    输入数据：
    ```
    [
      {"product": "iPhone", "conversion_rate": "3.45%"},
      {"product": "iPad", "conversion_rate": "2.78%"},
      {"product": "MacBook", "conversion_rate": "4.12%"}
    ]
    ```

    正确输出（将 "%" 转换为小数）：
    ```json
    {
      "recommendedChart": "bar",
      "confidence": 0.9,
      "reasoning": "按产品展示转化率对比",
      "alternatives": ["line"],
      "chartConfig": {
        "title": "产品转化率",
        "xAxis": "product",
        "yAxis": "conversion_rate",
        "series": [
          {
            "name": "转化率",
            "type": "bar",
            "data": [
              {"name": "iPhone", "value": 0.0345},
              {"name": "iPad", "value": 0.0278},
              {"name": "MacBook", "value": 0.0412}
            ]
          }
        ]
      }
    }
    ```

    **示例 3（普通数值）**：
    输入数据：
    ```
    [
      {"id": 1, "product_name": "笔记本", "amount": 5800, "status": "paid"},
      {"id": 2, "product_name": "手机", "amount": 3200, "status": "paid"},
      {"id": 3, "product_name": "鼠标", "amount": 150, "status": "pending"},
      {"id": 4, "product_name": "键盘", "amount": 450, "status": "cancelled"}
    ]
    ```

    正确输出（直接使用数值）：
    ```json
    {
      "recommendedChart": "bar",
      "confidence": 0.9,
      "reasoning": "按商品展示金额对比",
      "alternatives": ["pie"],
      "chartConfig": {
        "title": "商品订单金额",
        "xAxis": "product_name",
        "yAxis": "amount",
        "series": [
          {
            "name": "订单金额",
            "type": "bar",
            "data": [
              {"name": "笔记本", "value": 5800},
              {"name": "手机", "value": 3200},
              {"name": "鼠标", "value": 150},
              {"name": "键盘", "value": 450}
            ]
          }
        ]
      }
    }
    ```

    **记住**：
    - ❌ 不要输出："正在分析数据特征，生成图表配置..."
    - ❌ 不要输出：markdown 代码块标记（```json）
    - ✅ 直接输出：纯 JSON 对象
    - ✅ series 必须是数组；仅 `recommendedChart="table"` 时可为空数组
    - ✅ 优先生成图表，不要轻易推荐 table（但满足 L1 单数字或数据完整性失败时必须推荐 table）

error_recovery:
  name: "错误恢复"
  version: "1.1"
  description: "SQL错误分析和恢复"
  variables: ["original_sql", "error_message", "semantic_context"]
  content: |
    分析SQL执行错误并生成修复后的SQL：

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 即使无法完全修复，也必须返回合法 JSON，并在 errorAnalysis 中说明
    - 禁止无依据假设：不得编造不存在的字段/表/日期来“修复”SQL

    原始SQL：
    {{original_sql}}

    错误信息：
    {{error_message}}

    语义上下文：
    {{semantic_context}}

    请分析错误原因并生成修复后的SQL语句。

    请以JSON格式返回：
    {
      "errorType": "syntax_error" | "field_not_found" | "table_not_found" | "type_mismatch" | "permission_denied",
      "errorAnalysis": "错误分析",
      "fixedSQL": "修复后的SQL语句",
      "changes": ["修改说明列表"],
      "confidence": 0.0-1.0
    }