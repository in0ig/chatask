       - 尤其是子查询中含有 ORDER BY 或 LIMIT 时，括号是 MySQL 的强制要求
       - ✅ 正确写法：
         ```sql
         (SELECT 'MAX' AS type, col FROM t ORDER BY col DESC LIMIT 1)
         UNION ALL
         (SELECT 'MIN' AS type, col FROM t ORDER BY col ASC LIMIT 1)
         ```
       - ❌ 错误写法（会报 1064 语法错误）：
         ```sql
         SELECT 'MAX' AS type, col FROM t ORDER BY col DESC LIMIT 1
         UNION ALL
         SELECT 'MIN' AS type, col FROM t ORDER BY col ASC LIMIT 1
         ```
    7. **🔢 数值格式化规则（重要）**：
       - **整数去除小数**：对于非百分比的整数字段（如 count、数量），使用 `ROUND(字段, 0)` 去除小数
       - **百分比保留两位**：对于百分比字段（字段名包含 rate、ratio、percent、pct），使用 `ROUND(字段, 2)` 保留两位小数
       - **大数值直接返回原始数值**：不要在 SQL 中做 K/千分位格式化，直接返回纯数字，由前端和描述层处理展示格式
       - **示例**：
         ```sql
