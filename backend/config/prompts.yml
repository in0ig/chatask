    ## 📊 对比分析类 SQL 规范（条件聚合）

    当用户要求对比两个或多个时间段（YoY、MoM、QoQ）时，必须遵守以下规则：

    **规则 A：必须使用条件聚合（Conditional Aggregation）**
    - ✅ 正确：使用 `SUM(CASE WHEN period_condition THEN metric ELSE 0 END)` 在单条 SQL 中完成多期对比
    - ❌ 禁止：使用多层嵌套 JOIN 来实现同环比计算（如 `t1 JOIN t2 ON t1.id = t2.id JOIN t3 ON ...`）

    **规则 B：SELECT 子句必须包含四要素（零容忍，违反即为无效 SQL）**
    任何涉及同比（YoY）、环比（MoM/QoQ）或对比分析的 SQL，SELECT 子句必须同时包含以下四类字段，缺一不可：
    1. 当期原始指标值（如 `ROUND(SUM(ATTN), 0) AS current_attendance`）
    2. 基期原始指标值（如 `ROUND(SUM(ATTN_LY), 0) AS prior_year_attendance`）
    3. 绝对差值（`current - prior AS abs_change`）
    4. 变化率：`ROUND((current - prior) / NULLIF(prior, 0) * 100, 2) AS pct_change`
    - `NULLIF(prior, 0)` 防止除零错误，必须使用

    **⚠️ 仅返回差值和变化率而不返回原始指标值 = 无效 SQL**
    原因：下游图表推荐和数据描述阶段依赖原始指标值来生成柱状图和摘要。
    如果缺少原始指标值，图表推荐会被迫将维度列（如 FW_N=17）误当数值使用，
    数据描述会将维度值误读为指标值（如"Paid Attendance 为 17"）。

    **自检清单**：生成 SQL 后，逐一检查 SELECT 中是否同时包含：
    - [ ] 当期原始值列（如 current_attendance）
    - [ ] 基期原始值列（如 prior_year_attendance）
    - [ ] 绝对差值列（如 abs_change）
    - [ ] 变化率列（如 pct_change）
    如果任一缺失，必须补全后再输出。

    **条件聚合示例（Q01-05 模式：月度环比）**：
    ```sql
    SELECT
      group_C,
      SUM(CASE WHEN FM_N = 11 THEN ATTN ELSE 0 END) AS atten_nov,
      SUM(CASE WHEN FM_N = 12 THEN ATTN ELSE 0 END) AS atten_dec,
      SUM(CASE WHEN FM_N = 12 THEN ATTN ELSE 0 END) -
        SUM(CASE WHEN FM_N = 11 THEN ATTN ELSE 0 END) AS abs_change,
      ROUND(
        (SUM(CASE WHEN FM_N = 12 THEN ATTN ELSE 0 END) -
         SUM(CASE WHEN FM_N = 11 THEN ATTN ELSE 0 END)) /
        NULLIF(SUM(CASE WHEN FM_N = 11 THEN ATTN ELSE 0 END), 0) * 100, 2
      ) AS pct_change
    FROM survey_attendance_mock
    WHERE FY_N = 2025 AND FM_N IN (11, 12) AND paidcompsp = 'PAID'
    GROUP BY group_C
    ORDER BY abs_change DESC
    ```

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 📈 Top-N 增长排名规则（子查询模式）

    当用户要求按增长率排名（如"增长最快的 Top 3 地区"）时，必须使用子查询或 CTE：
    - 在内层子查询中计算增长率
    - 在外层查询中应用 ORDER BY 和 LIMIT

    **Top-N 增长排名示例（Q01-08 模式）**：
    ```sql
    SELECT region5_C, growth_rate
    FROM (
      SELECT region5_C,
        SUM(CASE WHEN FM_N IN (1,2,3) THEN ATTN ELSE 0 END) AS q3_sum,
        SUM(CASE WHEN FM_N IN (4,5,6) THEN ATTN ELSE 0 END) AS q4_sum,
        ROUND(
          (SUM(CASE WHEN FM_N IN (4,5,6) THEN ATTN ELSE 0 END) -
           SUM(CASE WHEN FM_N IN (1,2,3) THEN ATTN ELSE 0 END)) /
          NULLIF(SUM(CASE WHEN FM_N IN (1,2,3) THEN ATTN ELSE 0 END), 0) * 100, 2
        ) AS growth_rate
      FROM survey_attendance_mock
      WHERE FY_N = 2025 AND paidcompsp = 'PAID'
      GROUP BY region5_C
      HAVING q3_sum > 0
    ) t
    ORDER BY growth_rate DESC
    LIMIT 3
    ```

