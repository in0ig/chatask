    ## 📖 业务术语映射规则（最高优先级，必须最先执行）

    在生成任何 SQL 之前，必须先在下方 semantic_context 中查找所有业务术语的定义：

    1. **强制查阅**：对用户问题中出现的每一个业务术语（如 "Paid attendance"、"Domestic"、"YoY"），必须先在 semantic_context 中查找其对应的字段名和过滤条件
    2. **严格应用**：如果找到定义（如 `业务术语: Paid Attendance → 过滤条件: paidcompsp = 'PAID'`），必须在 WHERE 子句中应用该**精确**过滤条件，不得修改字段名或值
    3. **禁止猜测**：禁止自行猜测或推断未在 semantic_context 中定义的业务术语含义；如果某术语未定义，在 explanation 中说明"未在 semantic_context 中找到该术语的定义，已基于字段名推断"
    4. **地理分组**：当 semantic_context 中包含地理分组定义（如 "Domestic = Shanghai + Neighboring Provinces + Other China"），必须使用 `IN (...)` 过滤对应字段值，不得使用单值等号
    5. **值不翻译**：字段值必须使用 semantic_context 中定义的原始值（如 `region5_C = 'Other China'`），禁止翻译为其他语言（如 `'其他中国'`）

    ## 🧭 字段判定语义规则（通用能力，必须遵守）
    - semantic_context 若提供“字段判定提示”或“值样本”，必须优先按该语义生成条件
    - 对二值/枚举字段（如值样本为 `Y/N`、`1/0`），类别判断必须使用等值条件（`=`/`IN`）
    - 禁止用 `IS NOT NULL`、`!= ''`、`<> ''` 代表某个业务类别（这会把 `N`/`0` 误判为命中）
    - 若字典与值样本冲突，以字典定义优先；若都缺失，在 explanation 说明“不确定，需要补充字段语义”

    ## 字典与值样本 → SQL 字面量（最高优先级，硬约束）
    - 凡 semantic_context 中为某列提供了「字典枚举」或「值样本」的，对该列写 `=` / `IN` 时，**必须使用其中出现的原文**（含大小写与语言；例如样本为 `Shanghai` 则禁止写成 `'上海'`；样本为 `Family` 则禁止写成 `'家庭游客'`）。
    - 用户问题中的中文地名、客群、渠道等**仅用于理解意图**，禁止不经语义上下文映射就直接当作该列的字符串字面量写入 SQL。
    - 若上下文同时有业务中文说明且值样本仅为英文库值，**以值样本与字典 code 为准** 生成 WHERE。
    - 缺少该列枚举或值样本证据时，不得在 explanation 中声称已按字典筛选；应说明证据不足并避免编造字面量。

