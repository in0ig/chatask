intent_recognition:
  name: "意图识别"
  version: "2.3"
  description: "识别用户问题的意图类型（支持历史对话上下文）"
  variables: ["user_question", "history_context", "current_date"]
  content: |
    请分析用户的问题，判断用户的意图类型：

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 即使置信度较低，也必须返回合法 JSON
    - 禁止无依据假设：不得凭空补全月份/财周/日期/筛选值；证据不足时必须在 reasoning 中明确“不确定”

    ## 当前日期时间
    {{current_date}}
    
    **🔒 时间计算规则（必须严格遵守）**：
    
    当用户提到相对时间时，必须基于当前日期计算具体日期范围：
    
    1. **"上周" / "Last week"**：
       - 定义：最近一个**完整**的财务周（周日至周六）
       - 计算方法：找到当前日期之前最近的一个完整周
       - 示例：当前 2026-02-13（五）→ 上周 = 2026-02-01（日）至 2026-02-07（六）
       - ⚠️ 错误：2026-02-08（日）至 2026-02-14（六）← 包含本周日期
    
    2. **"本周"**：当前所在财务周（本周日到今天）
    3. **"今天"**：当前日期
    4. **"昨天"**：当前日期的前一天
    5. **"本月"**：当前月份第一天到今天
    
    **重要**：不要假设或硬编码日期，必须基于当前日期动态计算

    ## 历史对话上下文
    {{history_context}}

    ## 当前用户问题
    {{user_question}}

    **重要提示**：
    - 如果历史对话中有上下文信息（如时间范围、筛选条件），当前问题可能是基于这些上下文的追问
    - 例如：上一轮问"上周的销售数据"，这一轮问"各渠道的分布"，应理解为"上周各渠道的销售数据分布"

    请从以下两种意图中选择一种：
    1. 智能问数：用户想要查询具体的数据，获取数值、统计结果等
    2. 生成报告：用户想要生成综合性的分析报告或总结

    请以JSON格式返回结果：
    {
      "intent": "query" | "report",
      "confidence": 0.0-1.0,
      "reasoning": "判断理由（如果是基于历史上下文的追问，请说明）"
    }

table_selection:
  name: "智能选表"
  version: "5.2"
  description: "根据用户问题选择相关数据表（支持历史对话上下文）"
  variables: ["user_question", "intent_type", "semantic_context", "history_context", "current_date"]
  content: |
    # 智能选表任务

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 即使信息不足，也必须返回合法 JSON（可用空数组 + 原因）
    - 禁止无依据假设：不得因为“看起来常见”就补齐时间范围、字段含义或数据分布
    
    ## 1. 当前日期时间
    {{current_date}}
    
    **重要提示**：
    - 当用户提到"今天"、"昨天"、"上周"、"本月"等相对时间时，必须基于当前日期计算具体日期范围
    - 不要假设或硬编码任何日期，必须使用当前日期进行计算
    - 不要假设数据的存在性或分布，所有判断必须基于实际查询结果
    
    ## 2. 历史对话上下文
    {{history_context}}
    
    **重要提示**：
    - 如果历史对话中提到了时间范围（如"上周"、"本月"），当前问题可能继承这个时间限定
    - 如果历史对话中提到了筛选条件（如"niche渠道"、"付费用户"），当前问题可能基于这些条件
    - 例如：历史对话问"上周各渠道的销售数据"，当前问"各品类的分布"，应理解为"上周各品类的销售数据分布"
    
    ## 3. 当前用户问题
    {{user_question}}
    
    ## 4. 意图类型
    {{intent_type}}
    
    ## 5. 语义增强上下文
    
    {{semantic_context}}
    
    ## 6. 🔒 强制规则（必须遵守）
    
    ### 6.1 理解历史上下文
    
    - ✅ **必须**：分析历史对话，理解用户的上下文限定条件
    - ✅ **必须**：如果当前问题是追问，需要继承历史对话中的时间范围、筛选条件等
    - 📝 **示例**：
      - 历史：用户问"上周各渠道的销售数据"
      - 当前：用户问"niche票型分布"
      - 理解：应该查询"上周 niche 渠道的票型分布"
    
    ### 6.2 如果上下文中显示"用户已选择的数据表"
    
    - ✅ **必须**：只能在用户选择的表范围内进行选择
    - ✅ **允许**：选择用户选择的全部表，或者其中的部分表
    - ❌ **禁止**：选择用户未选择的表
    - ❌ **禁止**：建议用户选择其他表
    - 📋 **返回格式**：在 selectedTables 中只返回用户已选择的表（全部或部分）
    - 📝 **说明要求**：在 overallReasoning 中说明为什么选择这些表，哪些字段与问题相关
    
    ### 6.3 如果上下文中显示"用户尚未选择数据表"
    
    - ❌ **禁止**：返回任何 selectedTables
    - ✅ **必须**：在 overallReasoning 中明确提醒用户先选择数据表
    - ✅ **允许**：建议用户应该选择哪些表（基于问题内容）
    - 📋 **返回格式**：selectedTables 返回空数组 []
    
    ### 6.4 分析依据（按优先级排序）
    
    1. **历史对话上下文** - 理解用户的追问意图
    2. **表结构和字段列表** - 了解表中有哪些字段
    3. **字段描述** - 理解字段的业务含义
    4. **数据字典关联** - 了解字段的枚举值和映射关系
    5. **表关联关系** - 理解表之间的外键关系，便于多表查询
    6. **全局知识库** - 数据源级别的语义信息
    7. **表级别知识库** - 表级别的语义信息
    
    **优先使用**：有字段描述和数据字典关联的字段
    
    ## 7. 返回格式（JSON）
    
    ```json
    {
      "selectedTables": [
        {
          "tableName": "表名（必须是用户已选择的表的真实表名）",
          "relevanceScore": 0.0-1.0,
          "reasoning": "选择理由（说明为什么选择这个表，哪些字段与问题相关，是否基于历史上下文）",
          "relevantFields": ["相关字段列表"]
        }
      ],
      "overallReasoning": "整体选择逻辑（如果用户未选表，请提醒；如果用户已选表，说明为什么选择这些表；如果是追问，说明如何理解历史上下文）"
    }
    ```
    
    ## 8. 示例（包含历史上下文）
    
    ### 示例 1：基于历史上下文的追问
    
    **历史对话**：
    ```
    用户: 上周各渠道的Attendance分布
    AI助手: 【智能选表】用户选择了 survey_attendance_mock 表...
    ```
    
    **当前用户问题**："niche票型分布情况"
    
    **上下文**：用户已选择 survey_attendance_mock 表
    
    **正确返回**：
    ```json
    {
      "selectedTables": [
        {
          "tableName": "survey_attendance_mock",
          "relevanceScore": 1.0,
          "reasoning": "基于历史对话，用户在上一轮询问了'上周各渠道的Attendance分布'，本轮追问'niche票型分布'。理解为查询上周 niche 渠道的票型分布。表中包含 Channel（渠道）、paidcompsp（票型）、ATTN（Attendance）等相关字段。",
          "relevantFields": ["Channel", "paidcompsp", "ATTN", "Sample_Size", "FW_START_DATE", "FW_END_DATE", "FW_N"]
        }
      ],
      "overallReasoning": "这是一个基于历史上下文的追问。上一轮用户询问了'上周各渠道的Attendance分布'，本轮追问'niche票型分布情况'，应理解为：在上周的时间范围内，查询 niche 渠道的票型分布。survey_attendance_mock 表包含所需的所有字段（Channel 用于筛选 niche，paidcompsp 用于分组统计票型，ATTN 用于统计数据）。"
    }
    ```
    
    ### 示例 2：用户已选择表
    
    **用户问题**："查询订单数据"
    
    **上下文**：用户已选择 orders 和 users 两个表
    
    **正确返回**：
    ```json
    {
      "selectedTables": [
        {
          "tableName": "orders",
          "relevanceScore": 1.0,
          "reasoning": "订单表包含订单的所有核心信息（订单ID、用户ID、商品名称、金额、状态、创建时间），直接满足查询订单数据的需求",
          "relevantFields": ["id", "user_id", "product_name", "amount", "status", "created_at"]
        }
      ],
      "overallReasoning": "用户问题是'查询订单数据'，orders 表包含所有订单相关字段，可以直接满足需求。users 表虽然被选择，但当前问题不需要用户详细信息，因此不选择。"
    }
    ```
    
    ### 示例 3：用户未选择表
    
    **用户问题**："查询订单数据"
    
    **上下文**：用户尚未选择数据表
    
    **正确返回**：
    ```json
    {
      "selectedTables": [],
      "overallReasoning": "您还没有选择数据表，请先在数据准备页面选择需要分析的数据表。根据您的问题'查询订单数据'，建议选择 orders（订单表）。"
    }
    ```

intent_clarification:
  name: "意图澄清"
  version: "4.1"
  description: "展示 AI 对用户问题的理解（支持历史对话上下文）"
  variables: ["user_question", "intent_type", "selected_tables", "semantic_context", "history_context", "current_date", "db_type"]
  content: |
    请分析用户问题并展示你的理解：

    ## 0. 输出硬约束（最高优先级）
    - 你必须只输出一个 JSON 对象
    - 输出首字符必须是 `{`，末字符必须是 `}`
    - 禁止输出 markdown、标题、说明文字、前后缀文本
    - 即使信息不足，也必须返回合法 JSON（可用空数组/空字符串兜底）
    - 禁止无依据假设：不得自行假设活动发生月份/具体财周/具体日期

    ## 当前日期时间
    {{current_date}}

    ## 当前数据库类型
    {{db_type}}
    
    **重要提示**：
    - 当用户提到"今天"、"昨天"、"上周"、"本月"等相对时间时，必须基于当前日期计算具体日期范围
    - "上周"定义为最近一个完整财务周（周日至周六），不能包含本周日期
    - 不要假设或硬编码任何日期，必须使用当前日期进行计算
    - 不要假设数据的存在性或分布，所有判断必须基于实际查询结果

    ## 历史对话上下文
    {{history_context}}

    **重要提示**：
    - 如果历史对话中有时间范围、筛选条件等信息，当前问题可能是基于这些上下文的追问
    - 例如：历史对话提到"上周"，当前问题是"各品类分布"，应理解为"上周各品类分布"
    - 在 clarificationText 中必须明确说明你理解了哪些历史上下文信息

    ## 当前用户问题
    {{user_question}}
    
    意图类型：{{intent_type}}

    选择的数据表：
    {{selected_tables}}

    语义上下文（表结构、字段描述）：
    {{semantic_context}}

    **你的任务**：
    向用户展示你对问题的理解，包括：
    1. **历史上下文继承**：如果是追问，说明你理解了哪些历史上下文信息
    2. **时间信息**：问题中的时间范围是什么？（如"2023年"、"上个月"、"最近7天"，或继承自历史对话）
    3. **维度信息**：要按什么维度分析？（如"按商品品类"、"各地区"）
    4. **指标信息**：要查询哪些指标？（如"销售额"、"订单数量"）
    5. **筛选条件**：有哪些筛选条件？（如"销售额大于1000"，或继承自历史对话）
    6. **你的理解**：用一句话总结你对问题的理解

    **重要**：
    - 这是一个"展示理解"的阶段，不是"等待用户回答"的阶段
    - 即使问题不够明确，也要展示你当前的理解，然后继续执行
    - `needsClarification` 字段只是标记问题是否明确，不会阻止流程继续
    - 如果是追问，必须在 clarificationText 中说明你理解了历史上下文

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    ## 📅 财务日历时间查询指令（重要）

    当用户问题中包含需要查询财务日历才能确定的时间表达时，你必须在返回的 JSON 中添加 `fiscalTimeQueries` 字段。
    系统会根据你的指令查询财务日历数据库，获取精确的财周日期范围，然后注入到后续的 Thinking 和 SQL 生成阶段。

    **需要生成 fiscalTimeQueries 的场景**：
    - "X年Y月第N周"、"X年Y月第一周"（未出现 FM/财月/财期）→ 查询该自然月中的第N个财周（`month_week`）
    - "FY25 年10月第一周" 这类表达（含 FY 但未出现 FM/财月/财期）→ 仍按自然月处理（`month_week`），不要改写成 `fiscal_month_week`
      - 若用户未写明确自然年（如未写“2024年/2025年”），`month_week` 中不要填 `year`，应填 `fiscalYear`（如 `FY2025`）作为约束
    - "FY25 FM10 第1周"、"FY2025 10财月第一周"、"财期10第1周" → 查询该财年该财月中的第N个财周（`fiscal_month_week`）
    - "X年Y月最后一周" → 查询该自然月中的最后一个财周
    - "X年Y月" → 查询该自然月包含的所有财周范围
    - "上个月第一周" → 先确定上个月是几月，再查询该月第一个财周
    - "春节前两周" → 先确定春节所在财周，再偏移 -2
    - 任何涉及"第N周"、"最后一周"、"前N周"等需要查财务日历的表达

    **不需要生成 fiscalTimeQueries 的场景**：
    - 已经是标准财周格式：FW22、FW 15
    - 已经是标准财月格式：FM3、FM12
    - 简单相对时间：上周、本周、上财周、本财月（这些由 TimeResolver 正则直接处理）
    - 明确的日期范围：2026-01-01 到 2026-01-31

    **禁止假设性 fiscalTimeQueries（必须遵守）**：
    - 若时间信息依赖“先查活动表/事件表”才能确定（例如仅给出“2025年 + 活动名”），不得输出任何假设月份（如“假设在1月”）
    - 不允许在 `description` 中出现“假设/推测/估计/可能/待确认”后仍输出具体 `year/month/weekIndex`
    - 这类场景必须返回 `fiscalTimeQueries: []`，并在 `analysis.timeInfo` / `filterInfo` 中明确“需先按活动名查活动表起止日期”

    **fiscalTimeQueries 格式**：
    ```json
    "fiscalTimeQueries": [
      {
        "type": "month_week",
        "year": 2026,
        "month": 1,
        "weekIndex": 2,
        "description": "2026年1月第二周"
      }
    ]
    ```

    **支持的查询类型**：
    | type | 必填参数 | 说明 |
    |------|---------|------|
    | `month_week` | year, month, weekIndex | 查询自然月中第N个财周（weekIndex从1开始，-1表示最后一个） |
    | `fiscal_month_week` | fiscalYear, fiscalMonth, weekIndex | 查询财年+财月中的第N个财周（weekIndex从1开始，-1表示最后一个） |
    | `month_range` | year, month | 查询自然月包含的所有财周的合并日期范围 |
    | `fw_offset` | baseFwLabel, offset | 基于某个财周偏移N周（如春节所在周的前2周） |

    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    请以JSON格式返回：
    {
      "needsClarification": true/false,
      "clarificationText": "我理解您的问题是：...",
      "clarificationQuestions": [],
      "analysis": {
        "isFollowUp": true/false,
        "inheritedContext": "继承的历史上下文信息",
        "hasTimeInfo": true/false,
        "timeInfo": "识别到的时间信息",
        "hasDimensionInfo": true/false,
        "dimensionInfo": "识别到的维度信息",
        "hasMetricInfo": true/false,
        "metricInfo": "识别到的指标信息",
        "hasFilterInfo": true/false,
        "filterInfo": "识别到的筛选条件",
        "isAmbiguous": true/false
      },
      "fiscalTimeQueries": []
    }

    **注意**：`fiscalTimeQueries` 为空数组 `[]` 表示不需要查询财务日历；只有当时间表达需要查财务日历才能确定时才填写。

    **示例（基于历史上下文的追问）**：
    
    历史对话：
    ```
    用户: 上周各渠道的Attendance分布
    AI助手: 【意图识别】识别到您的问题类型为：智能问数
    【智能选表】用户选择了 survey_attendance_mock 表
    【模型思考】用户需要查询上周各渠道的Attendance分布...
    ```
    
    当前用户问题："niche票型分布情况"
    
    正确返回：
    ```json
    {
      "needsClarification": false,
      "clarificationText": "我理解您的问题是：查询上周 niche 渠道的票型分布情况。基于历史对话，您在上一轮询问了'上周各渠道的Attendance分布'，本轮追问'niche票型分布情况'，我理解为：在上周的时间范围内，查询 niche 渠道的票型（paidcompsp）分布。时间范围明确（上周，继承自历史对话），筛选条件明确（niche 渠道），分析维度明确（票型），查询指标明确（Attendance）。",
      "clarificationQuestions": [],
      "analysis": {
        "isFollowUp": true,
        "inheritedContext": "时间范围：上周（继承自历史对话）",
        "hasTimeInfo": true,
        "timeInfo": "上周（继承自历史对话）",
        "hasDimensionInfo": true,
        "dimensionInfo": "票型（paidcompsp）",
        "hasMetricInfo": true,
        "metricInfo": "Attendance",
        "hasFilterInfo": true,
        "filterInfo": "Channel='Niche'",
        "isAmbiguous": false
      }
    }
    ```

    **示例1（问题明确）**：
    用户问题："2023年各商品品类的销售额分别是多少"
    返回：
    {
      "needsClarification": false,
      "clarificationText": "我理解您的问题是：查询2023年各商品品类的销售额。时间范围明确（2023年），分析维度明确（商品品类），查询指标明确（销售额）。",
      "clarificationQuestions": [],
      "analysis": {
        "hasTimeInfo": true,
        "timeInfo": "2023年",
        "hasDimensionInfo": true,
        "dimensionInfo": "商品品类",
        "hasMetricInfo": true,
        "metricInfo": "销售额",
        "hasFilterInfo": false,
        "filterInfo": "",
        "isAmbiguous": false
      }
